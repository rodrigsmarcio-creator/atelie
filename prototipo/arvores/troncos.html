<!doctype html>
<html lang="pt-BR" data-theme="borgonha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troncos · Árvore do Ateliê (protótipo)</title>
<meta name="color-scheme" content="dark">
<!--
  Troncos (ATL-57): Árvore inspirada no Arc Raiders. Só a ideia, nada copiado.
  - Um tronco colorido por Matéria que cresce de baixo para cima, com curvas grossas (acesas = já com prova).
  - Cada disco mostra as 5 dimensões num pentágono de pontinhos e o contador "3/5" numa pílula, cadeado quando Bloqueado.
  - Título da Matéria embaixo do tronco, com o domínio em número grande.
  - Densidade por revelação progressiva: só os ramos principais ficam abertos; quem tem filhos escondidos mostra "+N".
    Clique no Ofício (ou no botão do card) para abrir ou fechar o ramo. ?abrir=N muda a profundidade inicial.
  - Leveza: canvas único; só entram na tela os Ofícios abertos, então mesmo com 6000 Ofícios o desenho inicial é pequeno.
-->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('tema');
    if (t === 'tokyo' || t === 'borgonha' || t === 'verde') document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div id="app" style="display:contents"></div>
<noscript><p style="padding:24px">Este protótipo precisa de JavaScript.</p></noscript>
<script src="dados.js"></script>
<script src="motor.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  'use strict';
  const A = window.Atl;
  const TAU = Math.PI * 2;
  const COL = 80, LINHA = 124, R = 22;
  const profInicial = Number.parseInt(A.params.get('abrir') || '', 10) || (A.OFICIOS.length <= 60 ? 99 : 2);
  let abertos = A.abrirAte(profInicial);
  let zonas = [];

  /* ----- Layout: uma árvore por matéria, só com os ramos abertos ----- */
  function montar() {
    const nos = [], porId = new Map();
    let x = 0, profMax = 1;
    zonas = [];
    A.MATERIAS.forEach((m) => {
      const vis = A.visivel(m.id, abertos, false), x0 = x;
      vis.pre.forEach((o) => {
        const n = { id: o.id, o, x: x0 + (vis.slot.get(o.id) + 0.5) * COL, y: -(vis.prof.get(o.id) - 1) * LINHA, r: R, hit: 1.35,
          oculto: !abertos.has(o.id) && A.filhosDe.get(o.id).length ? A.tamanho.get(o.id) - 1 : 0 };
        nos.push(n); porId.set(o.id, n);
        profMax = Math.max(profMax, vis.prof.get(o.id));
      });
      const raiz = porId.get(A.raizesDe(m.id)[0].id);
      zonas.push({ m, raiz, x0, x1: x0 + Math.max(1, vis.folhas) * COL });
      x += Math.max(1, vis.folhas) * COL + 190;
    });
    const desloca = -(x - 190) / 2;
    nos.forEach((n) => { n.x += desloca; });
    const ligs = A.ligacoes.filter((l) => porId.has(l.a.id) && porId.has(l.b.id))
      .map((l) => ({ a: porId.get(l.a.id), b: porId.get(l.b.id), tipo: l.tipo, extra: l.extra }));
    const lim = { x0: -(x - 190) / 2 - 120, x1: (x - 190) / 2 + 120, y0: -(profMax - 1) * LINHA - 100, y1: 330 };
    return { nos, ligs, lim };
  }
  function atualizar(manter) {
    const d = montar();
    v.setDados(d.nos, d.ligs, d.lim, manter);
    if (manter && v.sel) { v.cx = v.sel.x; v.cy = v.sel.y; }
    casca.detalhe(v.sel ? v.sel.o : null);
    v.pedir();
  }
  function abrirAteOficio(id) {
    for (let p = A.pai.get(id); p; p = A.pai.get(p.id)) abertos.add(p.id);
  }
  const temFilhos = (o) => A.filhosDe.get(o.id).length > 0;

  const casca = A.montar({ id: 'troncos', titulo: 'Troncos · um por matéria',
    irPara: (id) => {
      if (!v.porId(id)) { abrirAteOficio(id); atualizar(true); }
      const n = v.porId(id);
      if (n) v.escolher(n, true);
    },
    aoTema: () => { v.tema(); estilos = A.estilos(v.c); },
    detalheAcao: (o) => (temFilhos(o) ? { rotulo: abertos.has(o.id) ? 'Recolher ramo' : 'Expandir ramo',
      fn: () => { if (abertos.has(o.id)) abertos.delete(o.id); else abertos.add(o.id); atualizar(true); } } : null),
    acoes: [
      { rotulo: 'Expandir tudo', fn: () => { abertos = A.abrirAte(99); atualizar(false); } },
      { rotulo: 'Recolher', fn: () => { abertos = A.abrirAte(2); atualizar(false); } },
    ],
    legenda: '<li><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="5" width="18" height="12" rx="6" fill="var(--surface-2)" stroke="var(--xp)"/><text x="11" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="var(--xp)">+N</text></svg>Ramo fechado: clique para abrir</li>'
      + '<li><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="var(--muted)"/><circle cx="11" cy="7" r="1.6" fill="var(--mat-1)"/><circle cx="15" cy="10" r="1.6" fill="var(--muted)"/><circle cx="13.5" cy="14.5" r="1.6" fill="var(--muted)"/><circle cx="8.5" cy="14.5" r="1.6" fill="var(--mat-1)"/><circle cx="7" cy="10" r="1.6" fill="var(--muted)"/></svg>Pentágono: as 5 dimensões</li>' });
  let estilos;
  const v = A.palco({ canvas: casca.canvas, kFoco: 1.1, kMax: 3, ligacoes, nos: desenharNos, rotulos, aoEscolher });
  estilos = A.estilos(v.c);
  const inicial = montar();
  v.setDados(inicial.nos, inicial.ligs, inicial.lim);
  casca.ligar(v);

  /* Clicar num Ofício com ramo fechado abre o ramo; o card tem o botão para abrir e fechar à vontade. */
  function aoEscolher(n) {
    if (n && n.oculto) { abertos.add(n.id); atualizar(true); return; }
    casca.detalhe(n ? n.o : null);
  }

  /* ----- Desenho ----- */
  const larg = (vv, mn, w) => Math.max(mn / vv.k, w);
  function ligacoes(ctx, lista, vv) {
    const c = vv.c, grupos = new Map();
    for (const l of lista) {
      const chave = `${l.tipo}|${l.a.o.mat}|${l.extra ? 'x' : ''}`;
      let p = grupos.get(chave);
      if (!p) { p = new Path2D(); grupos.set(chave, p); }
      const m = (l.a.y + l.b.y) / 2;
      p.moveTo(l.a.x, l.a.y); p.bezierCurveTo(l.a.x, m, l.b.x, m, l.b.x, l.b.y);
    }
    ctx.lineCap = 'round';
    /* Primeiro as apagadas, depois as abertas, por cima as acesas. */
    ['apagada', 'aberta', 'acesa'].forEach((tipo) => grupos.forEach((p, chave) => {
      const [t, mat, extra] = chave.split('|');
      if (t !== tipo) return;
      if (t === 'acesa') { ctx.strokeStyle = c.mat[mat]; ctx.lineWidth = larg(vv, 1.8, extra ? 3 : 7); }
      else if (t === 'aberta') { ctx.strokeStyle = A.rgba(c.muted, 0.85); ctx.lineWidth = larg(vv, 1.4, extra ? 2 : 4); }
      else { ctx.strokeStyle = A.rgba(c.muted, 0.35); ctx.lineWidth = larg(vv, 1, extra ? 1.5 : 3); }
      ctx.stroke(p);
    }));
    /* Tronco que sobe de baixo até a raiz de cada matéria. */
    zonas.forEach((z) => {
      const i = A.info.get(z.raiz.id);
      ctx.strokeStyle = i.est === 'Bloqueado' ? A.rgba(c.muted, 0.4) : c.mat[z.m.id]; ctx.lineWidth = larg(vv, 2.5, 9);
      ctx.beginPath(); ctx.moveTo(z.raiz.x, z.raiz.y); ctx.lineTo(z.raiz.x, 230); ctx.stroke();
    });
  }
  function desenharNos(ctx, lista, vv) {
    const c = vv.c, tiny = new Map(), medios = new Map(), perto = [], fechados = [];
    for (const n of lista) {
      const i = A.info.get(n.id), rpx = n.r * vv.k, chave = `${i.est}|${n.o.mat}`;
      if (rpx < 3) (tiny.get(chave) || tiny.set(chave, []).get(chave)).push(n);
      else if (rpx < 10) { (medios.get(chave) || medios.set(chave, []).get(chave)).push(n); if (n.oculto) fechados.push(n); }
      else perto.push(n);
    }
    const s = 3 / vv.k;
    tiny.forEach((ns, chave) => {
      const [est, mat] = chave.split('|'), st = estilos[est][mat], p = new Path2D();
      ns.forEach((n) => p.rect(n.x - s / 2, n.y - s / 2, s, s));
      ctx.fillStyle = est === 'Bloqueado' ? A.rgba(c.muted, 0.55) : est === 'Disponível' ? A.rgba(st.cor, 0.6) : st.cor; ctx.fill(p);
    });
    medios.forEach((ns, chave) => {
      const [est, mat] = chave.split('|'), st = estilos[est][mat], p = new Path2D();
      ns.forEach((n) => { p.moveTo(n.x + n.r, n.y); p.arc(n.x, n.y, n.r, 0, TAU); });
      ctx.fillStyle = st.fill; ctx.fill(p); ctx.strokeStyle = st.stroke; ctx.lineWidth = 2.5 / vv.k; ctx.stroke(p);
    });
    if (fechados.length) {
      const p = new Path2D(), rr = 6 / vv.k;
      fechados.forEach((n) => { p.moveTo(n.x + n.r * 0.8 + rr, n.y - n.r * 0.8); p.arc(n.x + n.r * 0.8, n.y - n.r * 0.8, rr, 0, TAU); });
      ctx.fillStyle = c.xp; ctx.fill(p);
    }
    for (const n of perto) detalhe(ctx, n, vv);
  }
  function detalhe(ctx, n, vv) {
    const c = vv.c, i = A.info.get(n.id), st = estilos[i.est][n.o.mat], r = n.r, rpx = r * vv.k;
    /* Anel de progresso: a fração de dimensões provadas, a partir do topo. */
    if (i.est !== 'Bloqueado' && i.prov > 0 && i.est !== 'Dominado') {
      ctx.beginPath(); ctx.arc(n.x, n.y, r * 1.2, -Math.PI / 2, -Math.PI / 2 + (TAU * i.prov) / i.total);
      ctx.strokeStyle = st.cor; ctx.lineWidth = 3.2 / vv.k; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, TAU); ctx.fillStyle = st.fill; ctx.fill();
    ctx.setLineDash(st.dash ? [5 / vv.k, 4 / vv.k] : []); ctx.strokeStyle = st.stroke; ctx.lineWidth = 3 / vv.k; ctx.stroke(); ctx.setLineDash([]);
    if (i.est === 'Bloqueado') cadeado(ctx, n.x, n.y, r * 0.55, c.muted);
    else if (i.est === 'Dominado') {
      ctx.beginPath(); ctx.moveTo(n.x - r * 0.42, n.y + r * 0.02); ctx.lineTo(n.x - r * 0.1, n.y + r * 0.34); ctx.lineTo(n.x + r * 0.45, n.y - r * 0.32);
      ctx.strokeStyle = c.bg; ctx.lineWidth = r * 0.2; ctx.stroke();
    } else {
      A.dimsDe(n.o).forEach((d, k) => {
        const a = -Math.PI / 2 + (TAU / 5) * k, x = n.x + Math.cos(a) * r * 0.5, y = n.y + Math.sin(a) * r * 0.5;
        ctx.beginPath(); ctx.arc(x, y, r * 0.15, 0, TAU);
        if (d.na) { ctx.strokeStyle = A.rgba(c.muted, 0.7); ctx.lineWidth = 1 / vv.k; ctx.stroke(); }
        else { ctx.fillStyle = d.on ? st.cor : A.rgba(c.muted, 0.6); ctx.fill(); }
      });
    }
    if (i.revisar) { ctx.beginPath(); ctx.arc(n.x - r * 0.8, n.y - r * 0.8, r * 0.3, 0, TAU); ctx.fillStyle = c.bad; ctx.fill(); ctx.strokeStyle = c.bg; ctx.lineWidth = 1.5 / vv.k; ctx.stroke(); }
    if (rpx >= 20) {
      /* Pílula com o contador, como o "1/5" do jogo. */
      const t = i.est === 'Bloqueado' ? 'bloqueado' : `${i.prov}/${i.total}`, w = i.est === 'Bloqueado' ? 62 : 34, y = n.y + r + 15;
      ctx.beginPath(); ctx.roundRect(n.x - w / 2, y - 9, w, 18, 9); ctx.fillStyle = c.surface; ctx.fill();
      ctx.strokeStyle = i.est === 'Bloqueado' ? c.muted : st.cor; ctx.lineWidth = 1.5 / vv.k; ctx.stroke();
      ctx.fillStyle = i.est === 'Bloqueado' ? c.muted : c.text; ctx.font = `700 11px ${c.fText}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, n.x, y + 0.5);
    }
    if (n.oculto) {
      const w = 34, x = n.x + r * 0.95, y = n.y - r * 0.95;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - 9, w, 18, 9); ctx.fillStyle = c.surface2; ctx.fill(); ctx.strokeStyle = c.xp; ctx.lineWidth = 1.5 / vv.k; ctx.stroke();
      ctx.fillStyle = c.xp; ctx.font = `700 11px ${c.fText}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(`+${n.oculto > 999 ? '999' : n.oculto}`, x, y + 0.5);
    }
  }
  function cadeado(ctx, x, y, r, cor) {
    ctx.strokeStyle = cor; ctx.fillStyle = cor; ctx.lineWidth = r * 0.28;
    ctx.beginPath(); ctx.arc(x, y - r * 0.2, r * 0.55, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x - r * 0.85, y - r * 0.1, r * 1.7, r * 1.2, r * 0.2); ctx.fill();
  }
  /* Título da matéria embaixo do tronco: nome espaçado e o domínio em número grande, como no jogo. */
  function rotulos(ctx, lista, vv) {
    const c = vv.c;
    zonas.forEach((z) => {
      const x = vv.sx(z.raiz.x), y = vv.sy(250);
      if (x < -200 || x > vv.W + 200 || y < -60 || y > vv.H + 120) return;
      const dom = A.dominioDe(A.deMateria(z.m.id)).pct, cor = c.mat[z.m.id];
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = `700 ${Math.min(18, Math.max(12, 30 * vv.k))}px ${c.fText}`; ctx.letterSpacing = '3px'; ctx.fillStyle = cor; ctx.fillText(A.nomeCurto(z.m, vv.W).toUpperCase(), x, y);
      ctx.letterSpacing = '0px'; ctx.font = `700 ${Math.min(46, Math.max(24, 70 * vv.k))}px ${c.fTitle}`; ctx.fillStyle = c.text; ctx.fillText(String(dom), x, y + Math.min(46, Math.max(24, 70 * vv.k)) + 2);
    });
  }
})();
</script>
</body>
</html>
