<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ateliê</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      screens: { sm: '560px', md: '760px', lg: '1024px', xl: '1280px', '2xl': '1536px' },
      extend: {
        colors: {
          ink: { 950: '#05070c', 900: '#080b12', 800: '#0d1220', 700: '#131a2b', 600: '#1b2438', 500: '#2a3650' },
          line: '#232d42', text: '#e7eaf1', muted: '#929cb0',
          bronze: { DEFAULT: '#c8925a', light: '#e3b685', dark: '#8d5f33' },
          gold: '#e8c15a', gain: '#7ccf9b', risk: '#e57b5d'
        },
        fontFamily: { sans: ['ui-sans-serif', 'system-ui', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'] }
      }
    }
  };
</script>
<style>
  /* Ateliê: tinta escura, bronze, uma só paleta (tema único, por escolha). Layout: rail + sidebar contextual + tela + Mestre. */
  :root { --bg:#080b12; --surface:#0d1220; --line:#232d42; --text:#e7eaf1; --muted:#929cb0; --bronze:#c8925a; --bronze-light:#e3b685; --gold:#e8c15a; --gain:#7ccf9b; --risk:#e57b5d; color-scheme: dark; }
  html, body { height: 100%; }
  @media (min-width: 1000px) { html { font-size: 106%; } }
  body { background: var(--bg); color: var(--text); overscroll-behavior: none; }
  *:focus-visible { outline: 2px solid #e3b685; outline-offset: 2px; border-radius: 6px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #232d42; border-radius: 8px; border: 2px solid #080b12; }
  ::-webkit-scrollbar-track { background: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }

  @keyframes pulse-ring { from { transform: scale(1); opacity: .6; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 55% { transform: scale(1.9); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes ripple { from { transform: scale(.6); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
  @keyframes flash-edge { 0% { stroke-opacity: .2; } 50% { stroke-opacity: 1; stroke-width: 9; } 100% { stroke-opacity: 1; } }
  @keyframes toast-in { from { transform: translateY(-10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toast-out { to { transform: translateY(-6px); opacity: 0; } }
  @keyframes particle { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(200,146,90,.35); } 50% { box-shadow: 0 0 0 10px rgba(200,146,90,0); } }
  @keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
  .rise { animation: rise .35s ease both; } .fade-in { animation: fade .3s ease both; }
  .breathe { animation: breathe 2.6s ease-in-out infinite; }
  .flicker { animation: flicker 2.2s ease-in-out infinite; transform-origin: 50% 90%; }

  .toast { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem; border-radius: .9rem; background: #131a2b; border: 1px solid #2a3650; color: #e7eaf1; font-size: .875rem; box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: toast-in .3s ease both; }
  .toast.out { animation: toast-out .28s ease both; }
  .toast-ic { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 999px; background: rgba(200,146,90,.18); color: #e3b685; flex: none; }
  .toast-ic[data-tone="gain"] { background: rgba(124,207,155,.16); color: #7ccf9b; }
  .toast-ic[data-tone="risk"] { background: rgba(229,123,93,.16); color: #e57b5d; }
  .particle { position: absolute; border-radius: 999px; animation: particle .9s ease-out forwards; }

  /* marcadores de fase do plano (F2 a F6); o botão no rail liga e desliga */
  .fase { display: inline-block; vertical-align: middle; margin-left: .35rem; padding: 0 .3rem; border-radius: 4px; border: 1px solid #2a3650; font: 600 10px/1.5 ui-monospace, Menlo, monospace; color: #929cb0; letter-spacing: .04em; }
  .fase.f2 { color: #7ccf9b; border-color: #7ccf9b88; } .fase.f3, .fase.f4 { color: #e3b685; border-color: #e3b68588; } .fase.f5, .fase.f6 { color: #e57b5d; border-color: #e57b5d88; }
  body.sem-fases .fase { display: none; }

  /* árvore (SVG) */
  .tnode { cursor: pointer; outline: none; }
  .tnode .focus-ring { opacity: 0; fill: none; stroke: #e3b685; stroke-width: 2.5; stroke-dasharray: 5 5; }
  .tnode:focus-visible .focus-ring { opacity: 1; }
  .tnode .disc { stroke-width: 1.5; transition: fill .4s; }
  .tnode .ico { color: #10141c; }
  .tnode .ring-track { fill: none; stroke: #1b2438; stroke-width: 4; }
  .tnode .ring { fill: none; stroke: var(--c); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .tnode .nlabel { fill: #b4bccd; font-size: 12.5px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #080b12; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .st-locked .disc { fill: #0f1522; stroke: #2a3447; } .st-locked .ico { color: #465269; } .st-locked .nlabel { fill: #5c667c; }
  .st-disponivel .disc { fill: #8b94a6; stroke: #b4bccd; }
  .st-visto .disc { fill: #b0b8c6; stroke: #cdd2dc; }
  .st-praticado .disc { fill: #cdd2dc; stroke: #e3e6ee; }
  .st-dominado .disc { fill: #eef0f5; stroke: #ffffff; }
  .st-mestre .disc { fill: #f6e7b8; stroke: #e8c15a; stroke-width: 2.5; } .st-mestre .ring { stroke: #e8c15a; }
  .risk .disc { fill: #a8aebb; } .risk .glow { opacity: .25; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse-ring 2.4s ease-out infinite; fill: none; stroke: var(--c); stroke-width: 2.5; }
  .sat .sdisc { fill: #0d1220; stroke: #34415c; stroke-width: 1.4; transition: fill .3s; } .sat .sico { color: #4b5873; }
  .sat.on .sdisc { fill: var(--c); stroke: #ffffffaa; } .sat.on .sico { color: #0a0e16; }
  .sat-line { stroke: #2a3447; stroke-width: 1.6; } .sat-line.on { stroke: var(--c); stroke-width: 2; }
  .sat-pop, .node-pop { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.2,1.2,.3,1) both; }
  .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 1s ease-out both; fill: none; stroke: var(--c); stroke-width: 3; }
  .edge { stroke-linecap: round; transition: stroke .4s; }
  .edge-locked { stroke: #1c2536; stroke-width: 4; } .edge-open { stroke: #5d677d; stroke-width: 4; } .edge-lit { stroke: #dfe3ec; stroke-width: 5; }
  .edge.flash { animation: flash-edge 1.2s ease both; }
  .dim { opacity: .14; } .dim-soft { opacity: .5; }
  #treeSvg { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; } #treeSvg.grabbing { cursor: grabbing; }
  .tree-vignette { background: radial-gradient(ellipse at 50% 85%, rgba(200,146,90,.07), transparent 55%), radial-gradient(ellipse at center, transparent 40%, rgba(2,3,6,.75) 100%); }

  /* capas, anéis de progresso, cartões que viram */
  .cover { position: relative; aspect-ratio: 3 / 4; border-radius: 6px 12px 12px 6px; overflow: hidden; container-type: inline-size; background: linear-gradient(160deg, var(--a), var(--b)); border: 1px solid #232d42; box-shadow: inset 6px 0 0 rgba(0,0,0,.28), inset 7px 0 0 rgba(255,255,255,.06), 0 12px 24px rgba(0,0,0,.45); }
  .cover::before { content: ""; position: absolute; inset: 14px 14px 14px 22px; border: 1px solid rgba(232,193,90,.45); border-radius: 4px; }
  .cover::after { content: attr(data-glyph); position: absolute; right: 8%; bottom: -6%; font-family: Georgia, serif; font-size: 6rem; line-height: 1; color: rgba(255,255,255,.07); }
  .cover .t { position: absolute; left: 12%; right: 8%; top: 20%; font-family: Georgia, serif; font-size: clamp(.8rem, 9.5cqw, 1.3rem); line-height: 1.15; color: #f1dfb8; }
  .cover .a { position: absolute; left: 12%; right: 34%; bottom: 8%; font-size: clamp(.45rem, 4.2cqw, .65rem); letter-spacing: .14em; text-transform: uppercase; color: rgba(241,223,184,.7); }
  .pring { position: relative; display: grid; place-items: center; border-radius: 999px; background: conic-gradient(var(--c, #c8925a) calc(var(--p) * 1%), #1b2438 0); flex-shrink: 0; }
  .pring::after { content: ""; position: absolute; inset: 4px; border-radius: 999px; background: var(--in, #0d1220); }
  .pring > * { position: relative; z-index: 1; }
  .flip { perspective: 800px; } .flip > div { transition: transform .5s; transform-style: preserve-3d; position: relative; min-height: 9rem; }
  .flip.on > div { transform: rotateY(180deg); }
  .flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; padding: 1rem; text-align: center; border-radius: 1rem; }
  .flip .back { transform: rotateY(180deg); }

  /* modal, opções de questão, campos */
  .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 1rem; background: rgba(3,5,9,.72); backdrop-filter: blur(3px); animation: fade .2s ease both; }
  .modal-panel { width: min(640px, 100%); max-height: calc(100dvh - 2rem); overflow: auto; border-radius: 1.25rem; border: 1px solid #2a3650; background: #0d1220; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: rise .28s ease both; }
  .opt { display: flex; width: 100%; align-items: center; gap: .75rem; padding: .7rem .9rem; border-radius: .85rem; border: 1px solid #232d42; background: #131a2b; text-align: left; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: #3a4a6b; } .opt[aria-checked="true"] { border-color: #c8925a; background: rgba(200,146,90,.12); }
  .opt .k { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 999px; border: 1px solid #34415c; font-size: .75rem; font-weight: 700; color: #929cb0; flex: none; }
  .opt[aria-checked="true"] .k { background: #c8925a; color: #080b12; border-color: #c8925a; }
  .field { width: 100%; border-radius: .85rem; border: 1px solid #232d42; background: #080b12; padding: .65rem .85rem; font-size: .875rem; color: #e7eaf1; }
  .field::placeholder { color: #667189; } .field:focus { border-color: #c8925a; outline: none; box-shadow: 0 0 0 3px rgba(200,146,90,.18); }
  .sr-only-x { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* planejamento: grade da semana em linhas de 30 min (7h às 22h) */
  .cal { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); border: 1px solid #232d42; border-radius: 1rem; overflow: hidden; background: #0d1220; }
  .cal .h { padding: .5rem .25rem; text-align: center; font-weight: 600; font-size: .8rem; border-bottom: 1px solid #232d42; background: #131a2b; }
  .cal .h small { display: block; font-weight: 400; color: #929cb0; }
  .cal .h.hoje { color: #e3b685; }
  .cal .col { display: grid; grid-template-rows: repeat(30, 13px); border-left: 1px solid #232d42; position: relative; }
  .cal .col::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 25px, #1b2438 25px 26px); opacity: .7; }
  .cal .hours { display: grid; grid-template-rows: repeat(30, 13px); }
  .cal .hours span { grid-row: span 2; font: 10px ui-monospace, Menlo, monospace; color: #929cb0; text-align: right; padding-right: 5px; transform: translateY(-5px); }
  .bloco { position: relative; margin: 1px 3px; border-radius: 6px; padding: 2px 6px; font-size: 10.5px; line-height: 1.25; overflow: hidden; background: #131a2b; border-left: 3px solid #4b5873; color: #929cb0; }
  .bloco.est { background: rgba(200,146,90,.16); border-left-color: #c8925a; color: #e7eaf1; }
  .bloco.livre { background: rgba(124,207,155,.1); border-left-color: #7ccf9b; color: #e7eaf1; border-style: dashed; }

  /* Mestre (Claude): painel à direita */
  .msg { padding: .6rem .8rem; border-radius: .9rem; max-width: 94%; font-size: .85rem; line-height: 1.45; }
  .msg.eu { align-self: flex-end; background: rgba(200,146,90,.16); border: 1px solid rgba(200,146,90,.3); }
  .msg.ia { align-self: flex-start; background: #131a2b; border: 1px solid #232d42; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    .pulse { display: none; }
  }
</style>

<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-2xl border border-line bg-ink-800/80; }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition-all duration-150 select-none disabled:cursor-not-allowed disabled:opacity-40; }
    .btn-primary { @apply btn bg-bronze text-ink-900 hover:bg-bronze-light active:scale-[.98]; }
    .btn-ghost { @apply btn border border-line bg-ink-700/70 text-text hover:border-ink-500 hover:bg-ink-600; }
    .btn-quiet { @apply btn text-muted hover:bg-ink-700 hover:text-text; }
    .chip { @apply inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full border border-line bg-ink-800/70 px-3 py-1.5 text-xs font-medium text-muted transition hover:bg-ink-700 hover:text-text; }
    .chip[aria-pressed="true"], .chip[aria-checked="true"] { @apply border-bronze/70 bg-bronze/15 text-bronze-light; }
    .eyebrow { @apply text-[11px] font-semibold uppercase tracking-[.16em] text-bronze; }
    .bar { @apply h-2 w-full overflow-hidden rounded-full bg-ink-600; }
    .bar > i { @apply block h-full rounded-full bg-gradient-to-r from-bronze-dark to-bronze-light; transition: width .8s cubic-bezier(.2,.8,.2,1); }
    .rail-btn { @apply relative flex h-14 w-14 flex-col items-center justify-center gap-0.5 rounded-xl text-[10px] font-medium text-muted transition hover:bg-ink-700 hover:text-text; }
    .rail-btn.is-active { @apply bg-ink-700 text-bronze-light; }
    .side-item { @apply flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-muted transition hover:bg-ink-700 hover:text-text; }
    .side-item.is-active { @apply bg-ink-700 text-text; } .side-item.is-active svg { @apply text-bronze-light; }
    .stat { @apply flex flex-col items-start gap-1 rounded-xl border border-line bg-ink-700/50 p-4 text-left transition hover:border-ink-500 hover:bg-ink-700; }
    .tag { @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-[11px] font-semibold; }
    .glass { @apply rounded-2xl border border-line bg-ink-800/90 backdrop-blur; }
    .icon-btn { @apply grid h-10 w-10 place-items-center rounded-xl border border-line bg-ink-800/90 text-text transition hover:bg-ink-600 active:scale-95; }
    .statcard { @apply rounded-2xl border border-line bg-ink-800/80 px-5 py-4; }
  }
</style>
</head>

const fmtDate = days => { const d = dateFromAgo(days); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

/* ===================================================================== Modelo: provas, estados e domínio (no produto: packages/core, o Curador) ===================================================================== */
const STATUS_LABEL = { locked: 'Bloqueado', disponivel: 'Disponível', visto: 'Visto', praticado: 'Praticado', dominado: 'Dominado', mestre: 'Mestre' };
const topicOf = id => DATA.topics.find(t => t.id === id);
const topicsOf = subject => DATA.topics.filter(t => t.subject === subject);
const proofCount = (t, minAgo = 0) => t.proofs.filter(p => p !== null && p >= minAgo).length;
const isAtRisk = t => !!t.risk && proofCount(t) >= 1;
const riskTopics = () => DATA.topics.filter(isAtRisk);
const isUnlocked = (t, minAgo = 0) => t.req.every(id => proofCount(topicOf(id), minAgo) >= 2);
function statusOf(t, minAgo = 0) {
  if (!isUnlocked(t, minAgo)) return 'locked';
  const c = proofCount(t, minAgo);
  return c >= 5 ? 'mestre' : c >= 3 ? 'dominado' : c === 2 ? 'praticado' : c === 1 ? 'visto' : 'disponivel';
}
function masteryOf(subject, minAgo = 0) {
  const list = topicsOf(subject); if (!list.length) return 0;
  return list.reduce((s, t) => s + Math.min(proofCount(t, minAgo), 3), 0) / (list.length * 3);
}
const overallMastery = (minAgo = 0) => DATA.topics.reduce((s, t) => s + Math.min(proofCount(t, minAgo), 3), 0) / (DATA.topics.length * 3);
const totalProofs = () => DATA.topics.reduce((s, t) => s + proofCount(t), 0);
const missingToMaster = t => Math.max(0, 3 - proofCount(t));
const weekCount = () => DATA.week.studied.filter(Boolean).length;
const studiedToday = () => DATA.week.studied[DATA.week.todayIndex];
const dueCards = () => DATA.cards.filter(c => !state.cardsDone[c.q]);

/* O Curador v0: regras simples. Prioridade: risco > prova próxima > menos provas no Ofício liberado. */
function currentTopic() {
  const f = topicOf(state.focus);
  if (f && isUnlocked(f) && proofCount(f) < 3) return f;
  const list = DATA.topics.filter(t => isUnlocked(t) && proofCount(t) < 3);
  list.sort((a, b) => (isAtRisk(b) - isAtRisk(a)) || ((DATA.subjects[b.subject].exam ? 1 : 0) - (DATA.subjects[a.subject].exam ? 1 : 0)) || proofCount(b) - proofCount(a));
  return list[0] || null;
}
function curadorPlan() {
  const out = [], cur = currentTopic(), risk = riskTopics().find(t => !cur || t.id !== cur.id), cards = dueCards().length;
  if (cur) out.push({ t: cur, kind: 'Prática', min: 30, why: `${isAtRisk(cur) ? 'revisão vencida' : proofCount(cur) + ' de 5 provas'}${DATA.subjects[cur.subject].exam ? ' e ' + DATA.subjects[cur.subject].exam : ''}`, act: 'session-start', id: cur.id });
  if (risk) out.push({ t: risk, kind: 'Revisão', min: 15, why: `${cards} cartões vencidos${risk.riskDays ? ' há ' + risk.riskDays + (risk.riskDays === 1 ? ' dia' : ' dias') : ''}`, act: 'nav', id: 'cartoes' });
  const read = topicOf('l2');
  if (read && (!cur || cur.id !== 'l2')) out.push({ t: read, kind: 'Leitura', min: 40, why: 'pré-requisito de "Livro III" e "Alegoria da caverna"', act: 'nav', id: 'materiais', topic: 'l2' });
  return out.slice(0, 3);
}
function markStudiedToday() {
  if (studiedToday()) return null;
  DATA.week.studied[DATA.week.todayIndex] = true;
  DATA.streak.days += 1; DATA.streak.best = Math.max(DATA.streak.best, DATA.streak.days);
  return DATA.streak.days;
}
function addXp(n) {
  const u = DATA.user; let leveled = false; u.xp += n;
  while (u.xp >= u.xpNext) { u.xp -= u.xpNext; u.level += 1; u.xpNext = Math.round(u.xpNext * 1.12); leveled = true; }
  return leveled;
}
function bumpMission(id) { const m = DATA.missions.find(x => x.id === id); if (!m || m.done >= m.goal) return null; m.done += 1; return m.done >= m.goal ? m : null; }
function grantProof(t, slot) {
  const unlockedBefore = DATA.topics.filter(x => isUnlocked(x)).map(x => x.id), from = proofCount(t);
  if (slot >= 0) t.proofs[slot] = 0;
  const riskCleared = !!t.risk; t.risk = false;
  const to = proofCount(t);
  const ev = { topicId: t.id, slot, from, to, xp: slot >= 0 ? DATA.xpPerProof : 20, dominated: from < 3 && to >= 3, mastered: from < 5 && to >= 5, riskCleared, leveled: false, missions: [], unlocked: DATA.topics.filter(x => isUnlocked(x) && !unlockedBefore.includes(x.id)).map(x => x.id) };
  ev.leveled = addXp(ev.xp); ev.streak = markStudiedToday();
  const mission = slot >= 0 ? bumpMission('prova') : null;
  if (mission) { ev.missions.push(mission); ev.leveled = addXp(mission.xp) || ev.leveled; }
  if (ev.dominated && state.focus === t.id) state.focus = null;
  return ev;
}

  const sat = ev.slot >= 0 ? $(`#s-${ev.topicId}-${ev.slot}`) : null;
  if (sat) { const g = $('.satg', sat), d = $('.sdisc', sat); g.classList.add('sat-pop'); const rip = svgEl('circle', { cx: d.getAttribute('cx'), cy: d.getAttribute('cy'), r: 9, class: 'ripple', style: `--c:${col}` }); sat.appendChild(rip); setTimeout(() => rip.remove(), 1100); burstAt(d, col, 14); }
  if (ev.dominated) { $('.disc', node).classList.add('node-pop'); burstAt($('.disc', node), col, 36); $$(`.edge[data-from="${ev.topicId}"]`).forEach(e => e.classList.add('flash')); }
  ev.unlocked.forEach(id => { const n = $('#n-' + id); if (!n) return; const rip = svgEl('circle', { r: 28, class: 'ripple', style: `--c:${DATA.subjects[topicOf(id).subject].color}` }); n.appendChild(rip); setTimeout(() => rip.remove(), 1100); });
}

/* ===================================================================== Sessão de estudo (botão Começar) ===================================================================== */
const stopSessionTimer = () => { clearInterval(sessionTimer); sessionTimer = 0; };
const clockText = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function startSession(topicId) {
  const t = topicOf(topicId) || currentTopic(); if (!t) return;
  const plan = DATA.sessionPlans[state.time];
  state.session = { topicId: t.id, plan, step: 0, left: plan[0].min ? plan[0].min * 60 : null };
  renderSession(true);
}
function sessionMarkup() {
  const s = state.session, t = topicOf(s.topicId), sub = DATA.subjects[t.subject], cur = s.plan[s.step], info = DATA.stepInfo[cur.k], last = s.step === s.plan.length - 1;
  const steps = s.plan.map((x, i) => `<li class="flex-1"><div class="h-1.5 rounded-full" style="background:${i <= s.step ? DATA.stepInfo[x.k].color : '#1b2438'}"></div><p class="mt-1.5 truncate text-xs ${i === s.step ? 'font-semibold text-text' : 'text-muted'}">${DATA.stepInfo[x.k].name}</p></li>`).join('');
  const tips = { rev: `Antes de seguir, relembre: ${t.req.length ? t.req.map(id => topicOf(id).name).join(', ') : 'o que você já sabe de ' + subName(t.subject)}.`, teo: `Tema de hoje: ${t.name}. O material está na Biblioteca.`, exe: 'Faça a prova do Ofício. Ver a solução não conta.', cor: 'Anote no caderno de erros o que você errou.' }[cur.k];
  return `<div class="p-5 md:p-6"><div class="flex items-start justify-between gap-4"><div class="min-w-0"><p class="eyebrow">Sessão do Curador</p><h2 class="mt-1 text-xl font-semibold">${esc(t.name)}</h2><p class="text-sm" style="color:${sub.color}">${subName(t.subject)}</p></div><button class="icon-btn !h-9 !w-9 shrink-0" data-act="session-exit" aria-label="Sair da sessão">${icon('i-x', 'h-4 w-4')}</button></div>
    <ol class="mt-5 flex gap-2" aria-label="Etapas">${steps}</ol>
    <div class="mt-6 rounded-2xl border border-line bg-ink-900/60 p-5 text-center"><p class="text-sm font-semibold uppercase tracking-wider text-bronze">${info.name}</p><p id="sessTime" class="mt-1 text-5xl font-bold tabular-nums">${s.left === null ? 'Livre' : clockText(s.left)}</p><p class="mt-3 text-muted">${info.text}</p><p class="mt-1 text-sm">${tips}</p></div>
    <div class="mt-5 flex flex-wrap items-center justify-between gap-2">${cur.k === 'exe' ? `<button class="btn-ghost" data-act="prova" data-id="${t.id}">${icon('i-target', 'h-4 w-4')}Fazer prova</button>` : cur.k === 'teo' ? `<button class="btn-ghost" data-act="session-lib" data-id="${t.id}">${icon('i-library', 'h-4 w-4')}Abrir material</button>` : '<span></span>'}<button class="btn-primary" data-act="session-next" data-autofocus>${last ? 'Concluir sessão' : 'Concluir etapa'}${icon('i-arrow-right', 'h-4 w-4')}</button></div></div>`;
}
function renderSession(first) {
  if (!state.session) return;
  if (first) openModal(sessionMarkup(), { label: 'Sessão de estudo', onClose: () => { stopSessionTimer(); state.session = null; } }); else { setModal(sessionMarkup()); focusInModal(); }
  stopSessionTimer(); if (state.session.left !== null) sessionTimer = setInterval(tickSession, 1000);
}
function tickSession() { const s = state.session, el = $('#sessTime'); if (!s || !el || s.left === null) { stopSessionTimer(); return; } s.left = Math.max(0, s.left - 1); el.textContent = clockText(s.left); if (s.left === 0) stopSessionTimer(); }
function finishSession() {
  stopSessionTimer(); const leveled = addXp(50), m = bumpMission('sessao'); if (m) addXp(m.xp); const streak = markStudiedToday();
  state.modal.onClose = null; closeModal(); state.session = null; renderAll();
  toast('Sessão concluída: +50 XP', { icon: 'i-check', tone: 'gain' });
  if (streak) setTimeout(() => toast(`Sequência de ${streak} dias`, { icon: 'i-flame' }), 300);
  if (m) setTimeout(() => toast(`Missão cumprida: ${m.text} (+${m.xp} XP)`, { icon: 'i-check', tone: 'gain' }), 500);
  if (leveled) setTimeout(() => toast(`Você chegou ao nível ${DATA.user.level}`, { icon: 'i-star' }), 1000);
  burst(innerWidth / 2, innerHeight / 2.5, '#e3b685', 40);
}
Object.assign(ACTIONS, {
  'session-start'(el) { startSession(el.dataset.id); },
  study(el) { startSession(el.dataset.id); },
  'session-next'() { const s = state.session; if (s.step >= s.plan.length - 1) { finishSession(); return; } s.step += 1; s.left = s.plan[s.step].min ? s.plan[s.step].min * 60 : null; renderSession(); },
  'session-exit'() { closeModal(); },
  'session-lib'(el) { state.modal.onClose = null; closeModal(); stopSessionTimer(); state.session = null; state.libTopic = el.dataset.id; state.reading = null; go('materiais'); }
});

/* ===================================================================== Início ===================================================================== */
DATA.topics.forEach(t => { while (t.proofs.length < 5) t.proofs.push(null); });
let wasMobile = isMobile();
addEventListener('resize', () => { if (wasMobile !== isMobile()) { wasMobile = isMobile(); state.drawer = false; renderAll(); } });
state.tree.legend = innerWidth >= 1024;
if (isMobile()) state.tree.selected = null;
renderAll();
</script>
</body>
